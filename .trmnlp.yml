# trmnlp local preview configuration.
#
# On usetrmnl.com this plugin uses strategy "Plugin Merge" and reads a
# merge variable named after a native Google Calendar plugin instance
# (google_calendar_<id>). trmnlp has no Plugin Merge strategy, so the
# fixture below stands in for that merge variable: `variables:` is
# deep-merged into the top-level Liquid scope, which is exactly where a
# merge variable lands on the server.
#
# The node name here must match the `assign src = ...` line at the top of
# each src/*.liquid file.
---
watch:
  - .trmnlp.yml
  - src

time_zone: America/Chicago

custom_fields: {}

# The plugin's custom fields. On usetrmnl.com they arrive as top-level
# Liquid variables named after their keyname (declared in src/settings.yml),
# so they belong in `variables:` here - this trmnlp build does not forward
# the separate `custom_fields:` block into the render scope.
variables:
  cal_map: |
    you@gmail.com=black Personal
    work@example.com=orange
    shared@group.calendar.google.com=pink
    corp@example.com=yellow-60
    fun@example.com=red Fun
  default_color: white
  axis_mode: fit
  days: auto
  mode: grid
  agenda_calendars: ''
  bw_devices: BW0001
  cal_map_bw: |
    you@gmail.com=black Personal
    work@example.com=white Work
    shared@group.calendar.google.com=gray-30 Family
    corp@example.com=white
    fun@example.com=gray-65 Fun
  google_calendar_12345:
    instance_name: Calendar
    today_in_tz: '2026-09-07T00:00:00.000-05:00'
    calendar_names:
      you@gmail.com: Personal
      work@example.com: Work
      shared@group.calendar.google.com: Family
      corp@example.com: Corp
      fun@example.com: Fun
