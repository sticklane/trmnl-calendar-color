        calname: abc123@group.calendar.google.com
        all_day: false
        start: 4:00 PM
        end: 5:30 PM
        start_full: '2026-09-07T16:00:00-05:00'
        end_full: '2026-09-07T17:30:00-05:00'
      - summary: Quarterly planning review
        description: Bring the roadmap deck
        calname: work@google.com
        all_day: false
        start: 10:00 AM
        end: 11:30 AM
