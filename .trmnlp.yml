# trmnlp local preview configuration.
#
# On usetrmnl.com this plugin uses strategy "Plugin Merge" and reads a
# merge variable named after a native Google Calendar plugin instance
# (google_calendar_<id>). trmnlp has no Plugin Merge strategy, so the
# fixture below stands in for that merge variable: `variables:` is
# deep-merged into the top-level Liquid scope, which is exactly where a
# merge variable lands on the server.
#
# The node name here must match the `assign src = ...` line at the top of
# each src/*.liquid file.
---
watch:
  - .trmnlp.yml
  - src

time_zone: America/Chicago

custom_fields: {}

variables:
  google_calendar_12345:
    instance_name: Calendar
    today_in_tz: '2026-09-07T00:00:00.000-05:00'
    calendar_names:
      you@gmail.com: Personal
      work@google.com: Work
      abc123@group.calendar.google.com: Family
    events:
      - summary: Cousin Pam's
        description: ''
        calname: abc123@group.calendar.google.com
        all_day: true
        start: ''
        end: ''
        start_full: '2026-09-02'
        end_full: '2026-09-10'
      - summary: Trash day
        description: ''
        calname: abc123@group.calendar.google.com
        all_day: true
        start: ''
        end: ''
        start_full: '2026-09-08'
        end_full: '2026-09-09'
      - summary: Standup
        description: Daily sync
        calname: work@google.com
        all_day: false
        start: 9:00 AM
        end: 9:15 AM
        start_full: '2026-09-07T09:00:00-05:00'
        end_full: '2026-09-07T09:15:00-05:00'
      - summary: Overlapping call
        description: ''
        calname: work@google.com
        all_day: false
        start: 9:00 AM
        end: 10:00 AM
        start_full: '2026-09-07T09:00:00-05:00'
        end_full: '2026-09-07T10:00:00-05:00'
      - summary: Dentist
        description: Cleaning, 2nd floor
        calname: you@gmail.com
        all_day: false
        start: 11:30 AM
        end: 12:30 PM
        start_full: '2026-09-07T11:30:00-05:00'
        end_full: '2026-09-07T12:30:00-05:00'
      - summary: Soccer practice
