#
# On usetrmnl.com this plugin runs with strategy "Plugin Merge", which
# trmnlp models no strategy for. "polling" with an empty URL is the inert
# local stand-in: it polls nothing, so the preview renders entirely from
# the `variables:` fixture in .trmnlp.yml. Publish by pasting src/*.liquid
# into the site's markup tabs — see README. Do not `trmnlp push` this file:
# it would create a polling plugin, not a Plugin Merge one.
#
---
strategy: polling
polling_verb: get
polling_url: ''
no_screen_padding: 'no'
dark_mode: 'no'
framework_version: latest
name: Calendar Color
description: Calendar events by source color
refresh_interval: 900

# Custom fields. On usetrmnl.com these render as the plugin's own
# settings form; trmnlp only forwards a value from .trmnlp.yml's
# `custom_fields:` when the keyname is declared here. Keynames become
# top-level Liquid variables, so the markup reads {{ cal_map }},
# {{ default_color }} and {{ axis_mode }}.
custom_fields:
  - keyname: cal_map
    field_type: text
    name: Calendar colors
    description: >-
      One calendar-id=color per line, e.g. you@gmail.com=black. Ids are the
      calname values in the merge variable. On the B/W/R/Y panel only black,
      red, yellow and white print solid; grey steps are for 1-bit panels.
    placeholder: |
      you@gmail.com=black
      work@example.com=red
      shared@group.calendar.google.com=yellow
    optional: true
  - keyname: default_color
    field_type: select
    name: Default color
    description: Fill for any calendar not listed above.
    options:
      - black
      - red
      - yellow
      - white
    optional: true
  - keyname: axis_mode
    field_type: select
    name: Hour axis
    description: >-
      "fit" runs from an hour before the first event to an hour after the
      last one ends. "day" always shows midnight to midnight.
    options:
      - fit
      - day
    optional: true
  - keyname: days
    field_type: select
    name: Days shown
    description: >-
      "auto" shows the layout's own span (3 days full-width, 2 in the
      half-vertical and quadrant). "1" is single-day mode: today only,
      one column across the whole width, same hour axis.
    options:
      - auto
      - "1"
    optional: true
  - keyname: mode
    field_type: select
    name: View
    description: >-
      "grid" is the day grid. "agenda" lists upcoming one-off events by
      month from the calendars named below, as far ahead as the native
      calendar instance fetches (its "month" layout reaches 42 days).
    options:
      - grid
      - agenda
    optional: true
  - keyname: agenda_calendars
    field_type: text
    name: Agenda calendars
    description: >-
      Calendar ids to list in the agenda view, one per line. Leave empty
      to list every calendar that is not a quiet one.
    placeholder: |
      fun@group.calendar.google.com
    optional: true
  - keyname: cal_map_bw
    field_type: text
    name: Calendar colors (1-bit)
    description: >-
      The map a black-and-white device uses, same syntax. Use black, white
      and gray-10 to gray-75 (the number is the lightness: gray-75 is nearly
      white); text is black on gray-40 and lighter, white on gray-35 and
      darker. Empty maps the colour map automatically: yellow tints to
      white, red to gray-35, orange to gray-60, pink to gray-70.
    optional: true

